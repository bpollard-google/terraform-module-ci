name: module-ci

on:
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform version used by every job.
        type: string
        default: "1.13.3"
      tflint-version:
        description: tflint version used by the lint job.
        type: string
        default: "v0.55.1"
      checkov-version:
        description: Pinned Checkov release.
        type: string
        default: "3.2.492"

permissions:
  contents: read

concurrency:
  group: module-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: tflint
        # tflint --init pulls the google ruleset from the GitHub API; without a
        # token the runner shares an anonymous rate limit and init flakes.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform test
        run: terraform test -verbose

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install "checkov==${{ inputs.checkov-version }}"

      # First pass: no baseline, so the Security tab shows the full picture.
      # Baselined findings are filtered out of the report entirely, so this
      # cannot be the same invocation as the gate below.
      - name: Checkov (report)
        continue-on-error: true
        run: |
          checkov -d . \
            --framework terraform \
            --output sarif \
            --output-file-path .

      # Checkov 3.2.x names the file after the output format, so this is
      # results_sarif.sarif and not results.sarif. Verified against the
      # pinned release; a wrong name silently fails the upload step.
      #
      # Skipped for pull requests from forks. These repos are public, and on a
      # fork PR GitHub downgrades GITHUB_TOKEN to read-only whatever the
      # permissions block says, so the upload 403s, the security job reddens
      # and ci / gate blocks an external contributor whose Checkov run passed.
      # A fork PR cannot upload to the base repo's Security tab under any
      # configuration, so skipping forfeits nothing that was reachable, and
      # keeping the step un-continue-on-error preserves a hard signal for the
      # same-repo pushes and PRs where an upload failure is a real fault.
      # The event_name clause keeps uploads working on push to main, which is
      # where the Security tab's baseline actually comes from.
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results_sarif.sarif
          category: checkov

      # Second pass: baselined, and this one gates.
      - name: Checkov (gate)
        run: |
          checkov -d . \
            --framework terraform \
            --baseline .checkov.baseline \
            --compact

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: terraform-docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  gate:
    name: gate
    if: always()
    needs: [lint, test, security, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq .
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [[ -n "$failed" ]]; then
            echo "::error::One or more gate jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All gate jobs succeeded."
